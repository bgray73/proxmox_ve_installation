name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh first-boot/*.sh post-deploy/*.sh remote-access/*.sh
      - run: python -m compileall -q server scripts tests
      - run: python -m json.tool inventory.example.json >/dev/null
