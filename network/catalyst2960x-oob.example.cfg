! Cisco Catalyst 2960-X OOB / management example
! REVIEW interface numbers, management IP, firewall IP, and VLAN trunk design before use.
! This switch remains Layer 2. The upstream firewall/router performs inter-VLAN routing.
! Tailscale provides remote-management reachability via VLAN 40; do not route Corosync or PBS backup through it.

vlan 10
 name OOB_IDRAC_BMC
vlan 20
 name PVE_MGMT
vlan 30
 name PBS_MGMT
vlan 40
 name INFRA_TAILSCALE
vlan 50
 name IOT_DEVICES
vlan 60
 name APPLE_TV
vlan 70
 name IPHONES
vlan 80
 name WIFI_AP_MGMT
vlan 998
 name BLACKHOLE_NATIVE

! Switch management SVI — example only
interface Vlan10
 description OOB-SWITCH-MGMT
 ip address 10.10.10.2 255.255.255.0
 no shutdown

! Because this 2960-X is used as an L2 switch, use a default gateway rather than
! enabling ip routing. Replace 10.10.10.1 with the firewall/router gateway for VLAN 10.
ip default-gateway 10.10.10.1

! OOB controllers
interface GigabitEthernet1/0/1
 description PVE01-R640-iDRAC
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/2
 description PVE02-R640-iDRAC
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/3
 description PVE03-R440-iDRAC
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/4
 description PBS01-Supermicro-IPMI
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown

! 1Gb management fallback / management-plane interfaces on PVE nodes
interface GigabitEthernet1/0/5
 description PVE01-R640-1G-MGMT
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/6
 description PVE02-R640-1G-MGMT
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/7
 description PVE03-R440-1G-MGMT
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown

! Reserve for PBS 1Gb management if used
interface GigabitEthernet1/0/8
 description PBS01-1G-MGMT-OPTIONAL
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 shutdown

! Infrastructure / remote-management devices
interface GigabitEthernet1/0/9
 description UPS-MGMT
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/10
 description PDU-MGMT
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/11
 description TAILSCALE-SUBNET-ROUTER-1
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
interface GigabitEthernet1/0/12
 description TAILSCALE-SUBNET-ROUTER-2-OPTIONAL
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 shutdown

! Wireless AP trunk — AP's own management interface rides untagged/native on VLAN 80.
! IoT, Apple TV, and iPhone SSIDs are each mapped to their own tagged VLAN on the AP side.
! NOTE: mDNS/Bonjour (AirPlay discovery) does not cross VLANs by default. If Apple TV
! (VLAN 60) and iPhones (VLAN 70) are split like this, enable an mDNS reflector on the
! firewall/AP or AirPlay/casting between them will not work.
interface GigabitEthernet1/0/13
 description WIRELESS-AP-TRUNK
 switchport mode trunk
 switchport trunk native vlan 80
 switchport trunk allowed vlan 50,60,70,80
 spanning-tree portfast trunk
 no shutdown

! Optional wired access ports, one per new client VLAN, in case any of these devices
! connect by cable instead of Wi-Fi (e.g., a wired IoT hub or Apple TV).
interface GigabitEthernet1/0/14
 description IOT-WIRED-OPTIONAL
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 shutdown
interface GigabitEthernet1/0/15
 description APPLETV-WIRED-OPTIONAL
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 shutdown
interface GigabitEthernet1/0/16
 description IPHONE-WIRED-OPTIONAL
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 shutdown

! Firewall/router trunk.
! The firewall owns gateways/routes between VLANs 10/20/30/40/50/60/70/80 and enforces ACLs.
interface GigabitEthernet1/0/48
 description UPLINK-FIREWALL-OOB-8021Q
 switchport mode trunk
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,20,30,40,50,60,70,80,998
 no shutdown

! Routing intent on upstream firewall/router:
! VLAN 10  10.10.10.0/24  OOB iDRAC/BMC/switch management
! VLAN 20  10.10.20.0/24  PVE management
! VLAN 30  10.10.30.0/24  PBS management
! VLAN 40  10.10.40.0/24  Infrastructure + Tailscale subnet router(s)
! VLAN 50  10.10.50.0/24  IoT devices — recommend default-deny to mgmt VLANs (10/20/30),
!                          allow only internet + required local services
! VLAN 60  10.10.60.0/24  Apple TV
! VLAN 70  10.10.70.0/24  iPhones
! VLAN 80  10.10.80.0/24  Wireless AP management — treat like other infra mgmt VLANs;
!                          restrict access to admin hosts only
!
! Allow from authorized Tailscale clients via subnet router only to required management destinations/ports.
! Do NOT expose VLAN 21 Corosync or VLAN 31 PBS backup through this switch/Tailscale route.
! Do NOT use this 2960-X as the gateway unless you intentionally redesign it as an L3 switch and verify license/image support.
! Recommend firewall ACLs preventing VLAN 50 (IoT) from initiating connections to VLANs 10/20/30/80 (infra mgmt).

! Unused ports — shut and park in blackhole VLAN
interface range GigabitEthernet1/0/17-47
 description UNUSED-SHUT
 switchport mode access
 switchport access vlan 998
 shutdown

! Verify before saving:
! show vlan brief
! show interfaces trunk
! show interfaces status
! show ip interface brief
! ping 10.10.10.1
! write memory
