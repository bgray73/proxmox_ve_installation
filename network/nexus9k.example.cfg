! Nexus 9000 example — REVIEW interface numbers before use
! Assumption: L2 access switch; upstream firewall routes and filters VLANs.
feature lacp
vlan 10
  name IDRAC_BMC
vlan 20
  name PVE_MGMT
vlan 21
  name COROSYNC_A
vlan 30
  name PBS_MGMT
vlan 31
  name PBS_BACKUP
vlan 40
  name INFRA_SERVICES
vlan 100
  name VM_TRUNK
vlan 998
  name BLACKHOLE_NATIVE

interface Ethernet1/1
  description PVE01-R640-iDRAC
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
interface Ethernet1/2
  description PVE02-R640-iDRAC
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
interface Ethernet1/3
  description PVE03-R440-iDRAC
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
interface Ethernet1/4
  description PVE04-R440-iDRAC
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
interface Ethernet1/5
  description PBS01-Supermicro-BMC
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown

interface Ethernet1/11
  description PVE01-R640-DATA1
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/12
  description PVE02-R640-DATA1
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/13
  description PVE03-R440-DATA1
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/14
  description PVE04-R440-DATA1
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/15
  description PBS01-Supermicro-DATA1
  switchport
  switchport mode trunk
  switchport trunk native vlan 30
  switchport trunk allowed vlan 30,31
  spanning-tree port type edge trunk
  no shutdown

interface Ethernet1/46
  description TAILSCALE-SUBNET-ROUTER-1
  switchport
  switchport mode access
  switchport access vlan 40
  spanning-tree port type edge
  no shutdown
interface Ethernet1/47
  description TAILSCALE-SUBNET-ROUTER-2
  switchport
  switchport mode access
  switchport access vlan 40
  spanning-tree port type edge
  no shutdown
interface Ethernet1/48
  description UPLINK-FIREWALL-8021Q
  switchport
  switchport mode trunk
  switchport trunk native vlan 998
  switchport trunk allowed vlan 10,20,21,30,31,40,100,998
  no shutdown

! Put every unused interface in VLAN 998 and shut it down.
! Example only; adapt range to avoid configured/uplink ports.
interface Ethernet1/16-45
  description UNUSED-SHUT
  switchport
  switchport mode access
  switchport access vlan 998
  shutdown

! Save only after review and staged verification:
! copy running-config startup-config
