! Nexus 9000 example — REVIEW interface numbers before use
! Role: high-speed L2 underlay for PVE/PBS data, migration, Corosync, backup and SDN transport.
! Inter-VLAN routing and filtering are performed by the upstream firewall/router.
! iDRAC/BMC, 1Gb management and Tailscale subnet routers live on the Catalyst 2960-X OOB switch.
feature lacp

vlan 20
  name PVE_MGMT
vlan 21
  name COROSYNC_A
vlan 30
  name PBS_MGMT
vlan 31
  name PBS_BACKUP_40G
vlan 40
  name INFRA_SERVICES
vlan 100
  name SDN_VXLAN_TRANSPORT
vlan 998
  name BLACKHOLE_NATIVE

! Dell PVE data trunks. 40Gb Mellanox QSFP+ is the preferred primary path.
! If the 40Gb ports are Ethernet1/49-54 on the deployed Nexus, adapt these placeholders accordingly.
interface Ethernet1/11
  description PVE01-R640-DATA-PRIMARY
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/12
  description PVE02-R640-DATA-PRIMARY
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/13
  description PVE03-R440-DATA-PRIMARY
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown

! PBS 40Gb primary path. VLAN 31 is the dedicated backup/restore network.
interface Ethernet1/15
  description PBS01-SUPERMICRO-DATA-PRIMARY
  switchport
  switchport mode trunk
  switchport trunk native vlan 30
  switchport trunk allowed vlan 30,31
  spanning-tree port type edge trunk
  no shutdown

! Optional Dell 10Gb failover interfaces.
interface Ethernet1/21
  description PVE01-R640-10G-FAILOVER
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/22
  description PVE02-R640-10G-FAILOVER
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown
interface Ethernet1/23
  description PVE03-R440-10G-FAILOVER
  switchport
  switchport mode trunk
  switchport trunk native vlan 20
  switchport trunk allowed vlan 20,21,31,100
  spanning-tree port type edge trunk
  no shutdown

! Routed/firewall uplink. VLAN 10 OOB is intentionally NOT carried here unless
! the firewall design requires a shared trunk between production and OOB fabrics.
interface Ethernet1/48
  description UPLINK-FIREWALL-8021Q
  switchport
  switchport mode trunk
  switchport trunk native vlan 998
  switchport trunk allowed vlan 20,21,30,31,40,100,998
  no shutdown

! VLAN roles:
! 20  PVE management
! 21  Corosync ring A — low latency, no Internet access
! 30  PBS management
! 31  PVE <-> PBS backup/restore over 40Gb
! 40  Infrastructure services; routed to OOB/Tailscale only by firewall policy
! 100 Proxmox SDN / VXLAN transport underlay
! 998 Unused/native blackhole
!
! Do not route VLAN 21 through Tailscale.
! Do not advertise VLAN 31 through Tailscale.
! Keep SDN/VXLAN overlays on VLAN 100; keep management, Corosync and PBS backup native VLAN-based.

! Put every unused interface in VLAN 998 and shut it down.
! Adapt ranges to avoid active data/uplink/QSFP ports.
interface Ethernet1/24-47
  description UNUSED-SHUT
  switchport
  switchport mode access
  switchport access vlan 998
  shutdown

! Verification before saving:
! show interface status
! show vlan brief
! show interface trunk
! show spanning-tree vlan 20,21,30,31,40,100
! copy running-config startup-config
