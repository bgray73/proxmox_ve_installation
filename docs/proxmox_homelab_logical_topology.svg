<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #444; }
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 3; rx: 18; }
      .switch { fill: #eef3f8; }
      .server { fill: #f8f8f8; }
      .remote { fill: #f2f7fb; }
      .label { font: 700 25px Arial, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, sans-serif; fill: #333; }
      .tiny { font: 400 16px Arial, sans-serif; fill: #555; }
      .line40 { stroke: #1f77b4; stroke-width: 8; fill: none; }
      .line10 { stroke: #ff7f0e; stroke-width: 5; stroke-dasharray: 14 10; fill: none; }
      .line1 { stroke: #2ca02c; stroke-width: 5; fill: none; }
      .lineremote { stroke: #17a2b8; stroke-width: 5; stroke-dasharray: 10 8; fill: none; }
      .linepbs { stroke: #9467bd; stroke-width: 4; stroke-dasharray: 8 8; fill: none; }
      .legend { font: 400 18px Arial, sans-serif; fill: #222; }
    </style>
  </defs>

  <text x="800" y="58" text-anchor="middle" class="title">Proxmox Homelab — Logical Topology</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">3-node PVE cluster + PBS + secure remote management</text>

  <!-- Remote access -->
  <rect x="55" y="125" width="310" height="95" class="box remote"/>
  <text x="210" y="162" text-anchor="middle" class="label">Remote Admin</text>
  <text x="210" y="194" text-anchor="middle" class="small">iPhone / Mac / laptop</text>

  <rect x="430" y="125" width="300" height="95" class="box remote"/>
  <text x="580" y="162" text-anchor="middle" class="label">Tailscale</text>
  <text x="580" y="194" text-anchor="middle" class="small">Encrypted tailnet</text>

  <rect x="795" y="125" width="355" height="95" class="box remote"/>
  <text x="972" y="162" text-anchor="middle" class="label">Subnet Router</text>
  <text x="972" y="194" text-anchor="middle" class="small">Dedicated Linux appliance • VLAN 40</text>

  <path d="M365 172 L430 172" class="lineremote"/>
  <path d="M730 172 L795 172" class="lineremote"/>

  <!-- Core switches -->
  <rect x="505" y="275" width="590" height="100" class="box switch"/>
  <text x="800" y="314" text-anchor="middle" class="label">Cisco Nexus N9K-C9372TX</text>
  <text x="800" y="347" text-anchor="middle" class="small">40Gb primary + 10Gb failover / VM / migration / storage / backup</text>

  <rect x="70" y="440" width="350" height="105" class="box switch"/>
  <text x="245" y="481" text-anchor="middle" class="label">Catalyst 2960-X</text>
  <text x="245" y="513" text-anchor="middle" class="small">iDRAC / IPMI / 1Gb management</text>

  <path d="M972 220 C930 300, 545 355, 420 470" class="lineremote"/>
  <text x="610" y="354" class="tiny">management-only routed access</text>

  <!-- Servers -->
  <rect x="505" y="435" width="300" height="130" class="box server"/>
  <text x="655" y="472" text-anchor="middle" class="label">Dell R640 #1</text>
  <text x="655" y="502" text-anchor="middle" class="small">PVE01</text>
  <text x="655" y="533" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="875" y="435" width="300" height="130" class="box server"/>
  <text x="1025" y="472" text-anchor="middle" class="label">Dell R640 #2</text>
  <text x="1025" y="502" text-anchor="middle" class="small">PVE02</text>
  <text x="1025" y="533" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="505" y="675" width="300" height="130" class="box server"/>
  <text x="655" y="712" text-anchor="middle" class="label">Dell R440</text>
  <text x="655" y="742" text-anchor="middle" class="small">PVE03</text>
  <text x="655" y="773" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="875" y="675" width="300" height="130" class="box server"/>
  <text x="1025" y="712" text-anchor="middle" class="label">Supermicro 6028R</text>
  <text x="1025" y="742" text-anchor="middle" class="small">PBS01</text>
  <text x="1025" y="773" text-anchor="middle" class="tiny">40G + IPMI</text>

  <rect x="520" y="925" width="560" height="95" class="box"/>
  <text x="800" y="963" text-anchor="middle" class="label">Proxmox Workloads</text>
  <text x="800" y="995" text-anchor="middle" class="small">VMs • migration • Corosync • PBS backup traffic</text>

  <!-- 40G primary -->
  <path d="M655 435 L680 375" class="line40"/>
  <path d="M1025 435 L920 375" class="line40"/>
  <path d="M655 675 L760 375" class="line40"/>
  <path d="M1025 675 L840 375" class="line40"/>

  <!-- 10G failover -->
  <path d="M625 435 L635 375" class="line10"/>
  <path d="M995 435 L965 375" class="line10"/>
  <path d="M625 675 L705 375" class="line10"/>

  <!-- 1G/OOB -->
  <path d="M420 477 L505 477" class="line1"/>
  <path d="M420 497 C520 590, 555 660, 590 695" class="line1"/>
  <path d="M420 515 C560 605, 900 635, 940 695" class="line1"/>
  <path d="M420 457 C600 355, 950 365, 980 435" class="line1"/>

  <path d="M655 805 L715 925" class="linepbs"/>
  <path d="M1025 805 L885 925" class="linepbs"/>

  <text x="1160" y="307" class="tiny">5m Cisco QSFP-H40G-CU5M DACs</text>
  <text x="1160" y="334" class="tiny">to Mellanox MCX314A-BCCT NICs</text>

  <!-- Legend -->
  <rect x="1130" y="875" width="410" height="205" class="box"/>
  <text x="1160" y="915" class="label">Legend</text>
  <line x1="1160" y1="950" x2="1230" y2="950" class="line40"/>
  <text x="1250" y="957" class="legend">40Gb QSFP+ primary</text>
  <line x1="1160" y1="985" x2="1230" y2="985" class="line10"/>
  <text x="1250" y="992" class="legend">10Gb RJ45 failover</text>
  <line x1="1160" y1="1020" x2="1230" y2="1020" class="line1"/>
  <text x="1250" y="1027" class="legend">1Gb / OOB management</text>
  <line x1="1160" y1="1055" x2="1230" y2="1055" class="lineremote"/>
  <text x="1250" y="1062" class="legend">Tailscale remote management</text>
</svg>
