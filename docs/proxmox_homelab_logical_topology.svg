<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #444; }
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 3; rx: 18; }
      .switch { fill: #eef3f8; }
      .server { fill: #f8f8f8; }
      .remote { fill: #f2f7fb; }
      .vlanbox { fill: #fafafa; stroke: #666; stroke-width: 2; rx: 12; }
      .label { font: 700 25px Arial, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, sans-serif; fill: #333; }
      .tiny { font: 400 16px Arial, sans-serif; fill: #555; }
      .line40 { stroke: #1f77b4; stroke-width: 8; fill: none; }
      .line10 { stroke: #ff7f0e; stroke-width: 5; stroke-dasharray: 14 10; fill: none; }
      .line1 { stroke: #2ca02c; stroke-width: 5; fill: none; }
      .lineremote { stroke: #17a2b8; stroke-width: 5; stroke-dasharray: 10 8; fill: none; }
      .linepbs { stroke: #9467bd; stroke-width: 4; stroke-dasharray: 8 8; fill: none; }
      .legend { font: 400 18px Arial, sans-serif; fill: #222; }
      .vlan { font: 700 17px Arial, sans-serif; fill: #111; }
      .vdesc { font: 400 15px Arial, sans-serif; fill: #444; }
    </style>
  </defs>

  <text x="850" y="58" text-anchor="middle" class="title">Proxmox Homelab — Logical Topology</text>
  <text x="850" y="94" text-anchor="middle" class="subtitle">3-node PVE cluster + PBS + Tailscale remote management + SDN/VXLAN overlay</text>

  <!-- Remote access -->
  <rect x="55" y="125" width="310" height="95" class="box remote"/>
  <text x="210" y="162" text-anchor="middle" class="label">Remote Admin</text>
  <text x="210" y="194" text-anchor="middle" class="small">iPhone / Mac / laptop</text>

  <rect x="430" y="125" width="300" height="95" class="box remote"/>
  <text x="580" y="162" text-anchor="middle" class="label">Tailscale</text>
  <text x="580" y="194" text-anchor="middle" class="small">Encrypted tailnet</text>

  <rect x="795" y="125" width="355" height="95" class="box remote"/>
  <text x="972" y="162" text-anchor="middle" class="label">Subnet Router</text>
  <text x="972" y="194" text-anchor="middle" class="small">Dedicated Linux appliance • VLAN 40</text>

  <rect x="1210" y="125" width="390" height="95" class="box remote"/>
  <text x="1405" y="162" text-anchor="middle" class="label">Firewall / Router</text>
  <text x="1405" y="194" text-anchor="middle" class="small">Routes VLANs 10 / 20 / 30 / 40</text>

  <path d="M365 172 L430 172" class="lineremote"/>
  <path d="M730 172 L795 172" class="lineremote"/>
  <path d="M1150 172 L1210 172" class="lineremote"/>

  <!-- Core switches -->
  <rect x="540" y="285" width="590" height="100" class="box switch"/>
  <text x="835" y="324" text-anchor="middle" class="label">Cisco Nexus N9K-C9372TX</text>
  <text x="835" y="357" text-anchor="middle" class="small">40Gb primary + 10Gb failover / VM / migration / Corosync / backup / SDN transport</text>

  <rect x="70" y="455" width="350" height="120" class="box switch"/>
  <text x="245" y="493" text-anchor="middle" class="label">Catalyst 2960-X</text>
  <text x="245" y="525" text-anchor="middle" class="small">OOB + 1Gb management</text>
  <text x="245" y="551" text-anchor="middle" class="tiny">VLAN 10 / 20 / 30 / 40</text>

  <path d="M1405 220 C1330 315, 500 360, 420 485" class="lineremote"/>
  <text x="930" y="270" class="tiny">management-only routed access</text>

  <!-- Servers -->
  <rect x="505" y="455" width="300" height="130" class="box server"/>
  <text x="655" y="492" text-anchor="middle" class="label">Dell R640 #1</text>
  <text x="655" y="522" text-anchor="middle" class="small">PVE01</text>
  <text x="655" y="553" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="875" y="455" width="300" height="130" class="box server"/>
  <text x="1025" y="492" text-anchor="middle" class="label">Dell R640 #2</text>
  <text x="1025" y="522" text-anchor="middle" class="small">PVE02</text>
  <text x="1025" y="553" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="505" y="695" width="300" height="130" class="box server"/>
  <text x="655" y="732" text-anchor="middle" class="label">Dell R440</text>
  <text x="655" y="762" text-anchor="middle" class="small">PVE03</text>
  <text x="655" y="793" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="875" y="695" width="300" height="130" class="box server"/>
  <text x="1025" y="732" text-anchor="middle" class="label">Supermicro 6028R</text>
  <text x="1025" y="762" text-anchor="middle" class="small">PBS01</text>
  <text x="1025" y="793" text-anchor="middle" class="tiny">40G + IPMI</text>

  <!-- Data links -->
  <path d="M655 455 L690 385" class="line40"/>
  <path d="M1025 455 L955 385" class="line40"/>
  <path d="M655 695 L770 385" class="line40"/>
  <path d="M1025 695 L865 385" class="line40"/>

  <path d="M625 455 L650 385" class="line10"/>
  <path d="M995 455 L995 385" class="line10"/>
  <path d="M625 695 L725 385" class="line10"/>

  <!-- OOB/1G -->
  <path d="M420 492 L505 492" class="line1"/>
  <path d="M420 515 C500 610, 555 670, 590 715" class="line1"/>
  <path d="M420 540 C590 625, 905 655, 945 715" class="line1"/>
  <path d="M420 475 C600 385, 940 390, 980 455" class="line1"/>

  <!-- VLAN labels near fabric -->
  <rect x="1215" y="300" width="385" height="490" class="vlanbox"/>
  <text x="1407" y="335" text-anchor="middle" class="label">VLAN / Network Roles</text>

  <text x="1240" y="380" class="vlan">VLAN 10</text><text x="1340" y="380" class="vdesc">OOB / iDRAC / IPMI / switch mgmt</text>
  <text x="1240" y="425" class="vlan">VLAN 20</text><text x="1340" y="425" class="vdesc">PVE management</text>
  <text x="1240" y="470" class="vlan">VLAN 21</text><text x="1340" y="470" class="vdesc">Corosync — no Tailscale route</text>
  <text x="1240" y="515" class="vlan">VLAN 30</text><text x="1340" y="515" class="vdesc">PBS management</text>
  <text x="1240" y="560" class="vlan">VLAN 31</text><text x="1340" y="560" class="vdesc">PBS backup/restore over 40Gb</text>
  <text x="1240" y="605" class="vlan">VLAN 40</text><text x="1340" y="605" class="vdesc">Infrastructure + Tailscale router</text>
  <text x="1240" y="650" class="vlan">VLAN 100</text><text x="1340" y="650" class="vdesc">SDN / VXLAN transport underlay</text>
  <text x="1240" y="695" class="vlan">VLAN 998</text><text x="1340" y="695" class="vdesc">Blackhole / unused native</text>

  <text x="1240" y="742" class="tiny">Overlay VNets ride above VLAN 100.</text>
  <text x="1240" y="767" class="tiny">Keep VLANs 21 and 31 off Tailscale.</text>

  <!-- Workloads / overlay -->
  <rect x="480" y="925" width="700" height="110" class="box"/>
  <text x="830" y="962" text-anchor="middle" class="label">Proxmox SDN / VXLAN Overlay</text>
  <text x="830" y="994" text-anchor="middle" class="small">Example VNets: DEV • TEST • LAB • DMZ</text>
  <text x="830" y="1021" text-anchor="middle" class="tiny">Transport: VLAN 100 across the 40Gb Nexus underlay</text>

  <path d="M655 825 L735 925" class="linepbs"/>
  <path d="M1025 825 L925 925" class="linepbs"/>

  <text x="1160" y="322" class="tiny">5m Cisco QSFP-H40G-CU5M DACs</text>
  <text x="1160" y="348" class="tiny">Mellanox MCX314A-BCCT 40Gb NICs</text>

  <!-- Legend -->
  <rect x="70" y="900" width="345" height="225" class="box"/>
  <text x="100" y="940" class="label">Legend</text>
  <line x1="100" y1="975" x2="170" y2="975" class="line40"/>
  <text x="190" y="982" class="legend">40Gb primary</text>
  <line x1="100" y1="1010" x2="170" y2="1010" class="line10"/>
  <text x="190" y="1017" class="legend">10Gb failover</text>
  <line x1="100" y1="1045" x2="170" y2="1045" class="line1"/>
  <text x="190" y="1052" class="legend">1Gb / OOB</text>
  <line x1="100" y1="1080" x2="170" y2="1080" class="lineremote"/>
  <text x="190" y="1087" class="legend">Tailscale / routed mgmt</text>
</svg>
