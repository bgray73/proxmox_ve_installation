<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #111; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #444; }
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 3; rx: 18; }
      .switch { fill: #eef3f8; }
      .server { fill: #f8f8f8; }
      .label { font: 700 25px Arial, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, sans-serif; fill: #333; }
      .tiny { font: 400 16px Arial, sans-serif; fill: #555; }
      .line40 { stroke: #1f77b4; stroke-width: 8; fill: none; }
      .line10 { stroke: #ff7f0e; stroke-width: 5; stroke-dasharray: 14 10; fill: none; }
      .line1 { stroke: #2ca02c; stroke-width: 5; fill: none; }
      .linepbs { stroke: #9467bd; stroke-width: 4; stroke-dasharray: 8 8; fill: none; }
      .legend { font: 400 18px Arial, sans-serif; fill: #222; }
    </style>
  </defs>

  <text x="800" y="62" text-anchor="middle" class="title">Proxmox Homelab — Logical Topology</text>
  <text x="800" y="98" text-anchor="middle" class="subtitle">3-node PVE cluster + Proxmox Backup Server</text>

  <rect x="505" y="145" width="590" height="100" class="box switch"/>
  <text x="800" y="184" text-anchor="middle" class="label">Cisco Nexus N9K-C9372TX</text>
  <text x="800" y="217" text-anchor="middle" class="small">40Gb primary + 10Gb failover / VM / migration / storage / backup</text>

  <rect x="70" y="335" width="350" height="105" class="box switch"/>
  <text x="245" y="376" text-anchor="middle" class="label">Catalyst 2960-X</text>
  <text x="245" y="408" text-anchor="middle" class="small">iDRAC / IPMI / 1Gb management</text>

  <rect x="505" y="330" width="300" height="130" class="box server"/>
  <text x="655" y="367" text-anchor="middle" class="label">Dell R640 #1</text>
  <text x="655" y="397" text-anchor="middle" class="small">PVE01</text>
  <text x="655" y="428" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="875" y="330" width="300" height="130" class="box server"/>
  <text x="1025" y="367" text-anchor="middle" class="label">Dell R640 #2</text>
  <text x="1025" y="397" text-anchor="middle" class="small">PVE02</text>
  <text x="1025" y="428" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="505" y="570" width="300" height="130" class="box server"/>
  <text x="655" y="607" text-anchor="middle" class="label">Dell R440</text>
  <text x="655" y="637" text-anchor="middle" class="small">PVE03</text>
  <text x="655" y="668" text-anchor="middle" class="tiny">40G + 10G + 1G + iDRAC</text>

  <rect x="875" y="570" width="300" height="130" class="box server"/>
  <text x="1025" y="607" text-anchor="middle" class="label">Supermicro 6028R</text>
  <text x="1025" y="637" text-anchor="middle" class="small">PBS01</text>
  <text x="1025" y="668" text-anchor="middle" class="tiny">40G + IPMI</text>

  <rect x="520" y="805" width="560" height="95" class="box"/>
  <text x="800" y="843" text-anchor="middle" class="label">Proxmox Workloads</text>
  <text x="800" y="875" text-anchor="middle" class="small">VMs • migration • Corosync • PBS backup traffic</text>

  <path d="M655 330 L680 245" class="line40"/>
  <path d="M1025 330 L920 245" class="line40"/>
  <path d="M655 570 L760 245" class="line40"/>
  <path d="M1025 570 L840 245" class="line40"/>

  <path d="M625 330 L635 245" class="line10"/>
  <path d="M995 330 L965 245" class="line10"/>
  <path d="M625 570 L705 245" class="line10"/>

  <path d="M420 372 L505 372" class="line1"/>
  <path d="M420 392 C520 485, 555 555, 590 590" class="line1"/>
  <path d="M420 410 C560 500, 900 530, 940 590" class="line1"/>
  <path d="M420 352 C600 250, 950 260, 980 330" class="line1"/>

  <path d="M655 700 L715 805" class="linepbs"/>
  <path d="M1025 700 L885 805" class="linepbs"/>

  <text x="1160" y="180" class="tiny">5m Cisco QSFP-H40G-CU5M DACs</text>
  <text x="1160" y="207" class="tiny">to Mellanox MCX314A-BCCT NICs</text>

  <rect x="1130" y="760" width="390" height="175" class="box"/>
  <text x="1160" y="800" class="label">Legend</text>
  <line x1="1160" y1="835" x2="1230" y2="835" class="line40"/>
  <text x="1250" y="842" class="legend">40Gb QSFP+ primary</text>
  <line x1="1160" y1="870" x2="1230" y2="870" class="line10"/>
  <text x="1250" y="877" class="legend">10Gb RJ45 failover</text>
  <line x1="1160" y1="905" x2="1230" y2="905" class="line1"/>
  <text x="1250" y="912" class="legend">1Gb / OOB management</text>
</svg>
